plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.plugin.compose"
}

android {
    namespace "com.nickwoluff.wearfiles"
    compileSdk {
        version = release(37) { minorApiLevel = 0 }
    }

    defaultConfig {
        applicationId "com.nickwoluff.wearfiles"
        minSdk 25
        targetSdk 36
        versionCode 3
        versionName "0.3.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        compose true
    }
}

dependencies {
    implementation platform("androidx.compose:compose-bom:2026.09.00")
    implementation "androidx.activity:activity-compose:1.13.0"
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.foundation:foundation"
    implementation "androidx.compose.material3:material3:1.5.0-beta01"
    implementation "com.google.android.material:material:1.13.0"
    implementation "androidx.compose.material:material-icons-extended:1.7.8"
    implementation "androidx.wear.compose:compose-material3:1.7.1"
    implementation "androidx.wear.compose:compose-foundation:1.7.1"
    implementation "androidx.wear.compose:compose-navigation:1.7.1"
    implementation "androidx.wear:wear-input:1.2.0"
    implementation "androidx.core:core-ktx:1.17.0"
    testImplementation "junit:junit:4.13.2"
}

// 测试工作进程也会创建 Java NIO 套接字，必须使用相同的临时目录。
tasks.withType(Test).configureEach {
    systemProperty "jdk.net.unixdomain.tmpdir", rootProject.file(".socket-tmp").absolutePath
}
